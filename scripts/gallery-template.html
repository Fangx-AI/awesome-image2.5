<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image 2.5 — Prompt Atlas</title>
<style>
:root{color-scheme:light;--ink:#172522;--muted:#66756f;--paper:#f6f7f2;--line:#dbe2d9;--green:#235c43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--green)}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{letter-spacing:.12em}header a{text-decoration:none}main{max-width:1500px;margin:auto;padding:42px 5vw}.eyebrow{font-size:12px;letter-spacing:.17em;color:var(--green);font-weight:700}h1{font-size:clamp(38px,6vw,76px);line-height:1.05;letter-spacing:-.06em;margin:16px 0}h1 span{color:var(--green)}.intro{max-width:780px;color:var(--muted);font-size:17px}.stats{display:flex;gap:32px;flex-wrap:wrap;margin:26px 0 32px}.stats strong{display:block;font-size:25px;line-height:1.2}.stats span{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px;margin:28px 0 16px}input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.results{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:23px;display:flex;flex-direction:column;min-height:300px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--green)}h2{font-size:19px;line-height:1.4;margin:12px 0 8px}.id{color:var(--muted);font:11px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.excerpt{color:#57645e;font-size:13px;margin:16px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.bottom{margin-top:auto;display:flex;gap:8px;padding-top:14px}.bottom button,.secondary{border:1px solid var(--line);border-radius:7px;padding:7px 12px;background:white;color:var(--ink)}.bottom button:first-child{background:var(--green);color:white;border-color:var(--green)}.tag{display:inline-block;font-size:11px;border-radius:4px;background:#eef3ed;padding:2px 6px;margin-top:9px;margin-right:5px}.pagination{display:flex;justify-content:center;gap:18px;align-items:center;margin:30px 0}footer{padding:25px 5vw;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}dialog{width:min(860px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:16px;padding:30px;background:var(--paper)}dialog::backdrop{background:#10282088}dialog pre{white-space:pre-wrap;font:14px/1.8 system-ui;overflow-wrap:anywhere;background:white;padding:22px;border-radius:10px}dialog .close{float:right}.empty{padding:70px;text-align:center;color:var(--muted);grid-column:1/-1}#notice{min-height:1.5em;color:var(--green)}.filter-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.toolbar{grid-template-columns:1fr}main{padding:25px 5vw}header{font-size:12px}.stats{gap:20px}.results{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><strong>IMAGE 2.5 / PROMPT ATLAS</strong><a href="https://github.com/Fangx-AI/awesome-image2.5">GitHub ↗</a></header>
<main>
<div class="eyebrow">AN OPEN LIBRARY FOR VISUAL THINKING</div>
<h1>从一句灵感，<br>到<span>完整画面。</span></h1>
<p class="intro">搜索创作场景，选择任务侧重，复制完整提示词。基础案例与变体分别标注；所有条目目前均为待实测提示词，不代表已生成的图片数量。</p>
<div class="stats"><div><strong>__TOTAL__</strong><span>完整提示词</span></div><div><strong id="category-count"></strong><span>主题分类</span></div><div><strong id="original-count"></strong><span>基础案例</span></div><div><strong>0</strong><span>指定模型实测图</span></div></div>
<div class="toolbar">
<label><span class="filter-label">搜索名称、场景或提示词</span><input id="search" type="search" placeholder="试试：海报、宠物、透明、材质…" aria-label="搜索提示词"></label>
<label><span class="filter-label">分类</span><select id="category"><option value="">全部分类</option></select></label>
<label><span class="filter-label">工作方式</span><select id="mode"><option value="">生成与编辑</option><option value="generate">文生图</option><option value="edit">参考图编辑</option></select></label>
<label><span class="filter-label">条目类型</span><select id="kind"><option value="">基础案例与变体</option><option value="original" selected>只看基础案例</option><option value="variation">只看任务侧重变体</option></select></label>
</div>
<div class="results"><span id="count" aria-live="polite"></span><button class="secondary" id="export">导出筛选结果 JSON</button></div>
<p id="notice" role="status"></p><div class="grid" id="grid"></div>
<nav class="pagination" aria-label="结果分页"><button class="secondary" id="prev">上一页</button><span id="page"></span><button class="secondary" id="next">下一页</button></nav>
</main>
<dialog id="detail"><button class="secondary close" id="close">关闭</button><div class="label" id="detail-category"></div><h2 id="detail-title"></h2><div class="id" id="detail-meta"></div><pre id="detail-prompt"></pre><p id="detail-checks"></p><div class="bottom"><button id="copy-detail">复制提示词</button><button id="download-detail">下载 TXT</button></div></dialog>
<footer>原创基础案例 + 明确标注的任务侧重变体 · CC0 · 离线可用，无需 API Key · 实际生成需要具备相应模型访问权限。</footer>
<script id="catalog" type="application/json">__CATALOG_JSON__</script>
<script>
const data=JSON.parse(document.getElementById('catalog').textContent),$=id=>document.getElementById(id);
const size=36;let currentPage=1,filtered=data.entries,active=null;
$('category-count').textContent=data.categories.length;$('original-count').textContent=data.entries.filter(e=>e.kind==='original').length;
for(const c of data.categories){const o=document.createElement('option');o.value=c.id;o.textContent=c.title;$('category').append(o)}
function download(name,body,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function copy(text){try{await navigator.clipboard.writeText(text);$('notice').textContent='提示词已复制'}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();$('notice').textContent=ok?'提示词已复制':'浏览器未允许复制，请打开详情后手动选择文字。'}}
function openEntry(e){active=e;$('detail-category').textContent=e.category_title;$('detail-title').textContent=e.title;$('detail-meta').textContent=e.id+' · '+e.size+' · '+e.mode+' · 参考图至少 '+e.requires+' 张 · '+e.status;$('detail-prompt').textContent=e.prompt;$('detail-checks').textContent='检查要点：'+e.checks.join('；');$('detail').showModal()}
function render(){const total=Math.max(1,Math.ceil(filtered.length/size));currentPage=Math.min(currentPage,total);$('count').textContent='找到 '+filtered.length+' 条提示词';$('page').textContent=currentPage+' / '+total;$('prev').disabled=currentPage===1;$('next').disabled=currentPage===total;$('grid').replaceChildren();
for(const e of filtered.slice((currentPage-1)*size,currentPage*size)){const card=document.createElement('article');card.className='card';for(const [cls,text] of [['label',e.category_title+' / '+(e.mode==='edit'?'编辑':'生成')],['heading',e.title],['id',e.id],['excerpt',e.prompt]]){const node=document.createElement(cls==='heading'?'h2':'div');node.className=cls;node.textContent=text;card.append(node)}const tags=document.createElement('div');for(const text of [e.kind==='original'?'基础案例':'任务侧重变体',e.size,'待实测']){const tag=document.createElement('span');tag.className='tag';tag.textContent=text;tags.append(tag)}card.append(tags);const row=document.createElement('div');row.className='bottom';const view=document.createElement('button');view.textContent='查看完整提示词';view.onclick=()=>openEntry(e);const cp=document.createElement('button');cp.textContent='复制';cp.onclick=()=>copy(e.prompt);row.append(view,cp);card.append(row);$('grid').append(card)}
if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配结果，试试减少筛选条件。';$('grid').append(empty)}}
function filter(){const words=$('search').value.toLowerCase().trim().split(/\s+/).filter(Boolean);filtered=data.entries.filter(e=>(!$('category').value||e.category===$('category').value)&&(!$('mode').value||e.mode===$('mode').value)&&(!$('kind').value||e.kind===$('kind').value)&&words.every(w=>(e.title+' '+e.prompt+' '+e.id+' '+e.category_title+' '+e.category_en).toLowerCase().includes(w)));currentPage=1;render()}
for(const id of ['search','category','mode','kind'])$(id).addEventListener('input',filter);
$('prev').onclick=()=>{currentPage--;render()};$('next').onclick=()=>{currentPage++;render()};$('close').onclick=()=>$('detail').close();$('copy-detail').onclick=()=>copy(active.prompt);$('download-detail').onclick=()=>download(active.id+'.txt',active.prompt,'text/plain;charset=utf-8');$('export').onclick=()=>download('image25-filtered.json',JSON.stringify(filtered,null,2),'application/json');filter();
</script></body></html>
