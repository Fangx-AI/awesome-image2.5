[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image25-cli"
version = "0.6.0"
description = "GPT Image 2.5 prompt gallery and generation/editing CLI"
requires-python = ">=3.10"
license = "CC0-1.0"
dependencies = ["openai>=2.0.0", "Pillow>=10.0"]
readme = "README.md"

[project.scripts]
image25 = "image25.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image25"]
