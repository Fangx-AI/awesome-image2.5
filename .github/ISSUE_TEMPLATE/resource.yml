name: 提交提示词或案例
description: 分享一个 Image 2.5 提示词或生成结果
title: "[Gallery] "
body:
  - type: input
    id: title
    attributes:
      label: 案例标题与分类
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: 完整提示词
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 验证状态
      options:
        - prompt-only（尚未出图验证）
        - host-model-unknown（宿主未披露模型）
        - api-verified（有指定模型的调用记录）
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 模型、参数、结果与来源
      description: 附模型名、日期、尺寸、质量、输入来源和可分享的输出；不要提交密钥。
    validations:
      required: true
