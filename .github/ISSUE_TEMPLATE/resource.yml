name: 推荐资源
description: 推荐一个 AI 图像生成模型、工具或学习资源
title: "[资源] "
body:
  - type: input
    id: name
    attributes:
      label: 资源名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 官方链接
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      options:
        - 生成模型
        - 创作界面
        - 开发与训练
        - 参考图与结构控制
        - 修复与放大
        - 学习与工作流
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 用途与收录理由
      description: 请说明适用场景、核验日期、是否实际使用，以及你与项目的关联。
    validations:
      required: true
